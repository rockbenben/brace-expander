<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brace Expander 标记 —— 一对金色花括号，里面装着三行展开后的结果。

       为什么是花括号而不是别的：产品就叫 Brace Expander，语法是 bash 的 `{}`，
       上一版没有括号，是一摞彩色横条，和任意列表类工具无法区分。花括号在 16px
       下仍然认得出（favicon 实测：上一版缩小到 16px 后金色药丸糊成一坨、横条互相
       粘连；这一版的两条金色竖笔加中腰尖角完整保留），所以让花括号当外框，
       里面的东西是什么反而是次要的。

       金 = 花括号这套语法本身；靛蓝/青 = 模板里的两个槽位（`{1..4}` 与 `{tag,bal}`），
       与社交预览图里「{1..4} → 结果里的数字、{tag,bal} → 结果里的字」同一套图例。
       每行两段的宽度交替：真实展开里最左的花括号是外层、内层变量变化最快，
       `{1..4}_{tag,bal}` 就是短 tag 与长 id 交替 —— 这不是装饰，是展开结果的形状。

       ── 产物（改设计后重跑，{SKILL} = html-shot skill 目录）────────────────
         node {SKILL}/icons.mjs   design/brand/icon.svg public --preset next
         node {SKILL}/render.mjs  design/brand/icon.svg public/icon.png --width 512
         node {SKILL}/render.mjs  design/brand/icon.svg public/logo.png --width 1024
       第一条出 favicon.ico / apple-icon.png / icon.svg；第二、三条出 raster PNG。
       logo.png 是给 schema.org 的 SITE_LOGO 用的，框架没有自动约定，所以单独渲染。

       ⚠ 走浏览器（html-shot）而不是 sharp 手搓：sharp 的 SVG 光栅器不加载网络字体，
       且在部分滤镜上与 Chromium 渲染不一致 —— 那种情况下出来的图命令零报错、尺寸正常，
       只有肉眼看得出字形变了。这里是纯几何色块，两者本应一致，但少一个依赖总比多一个
       静默失败强。原先的 scripts/rasterize-brand.mjs 已被上面三条命令取代。
  -->
  <rect width="512" height="512" fill="#15171C"/>

  <g stroke="#F4B740" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 176,96 C 150,96 146,112 146,134 L 146,232 C 146,246 136,250 116,256 C 136,262 146,266 146,280 L 146,378 C 146,400 150,416 176,416"/>
    <path d="M 336,96 C 362,96 366,112 366,134 L 366,232 C 366,246 376,250 396,256 C 376,262 366,266 366,280 L 366,378 C 366,400 362,416 336,416"/>
  </g>

  <!-- 三行展开结果；纵向 150..362 与花括号 96..416 居中对齐（上下各留 54） -->
  <rect x="164" y="150" width="104" height="56" rx="19" fill="#6366F1"/>
  <rect x="276" y="150" width="72"  height="56" rx="19" fill="#22D3EE"/>

  <rect x="164" y="228" width="82"  height="56" rx="19" fill="#6366F1"/>
  <rect x="254" y="228" width="94"  height="56" rx="19" fill="#22D3EE"/>

  <rect x="164" y="306" width="116" height="56" rx="19" fill="#6366F1"/>
  <rect x="288" y="306" width="60"  height="56" rx="19" fill="#22D3EE"/>
</svg>
